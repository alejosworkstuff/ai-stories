<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Stories Generator</title>
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/history.css" />
  <link rel="stylesheet" href="./css/footer.css" />
  <link rel="stylesheet" href="./css/modal.css" />
  <link rel="stylesheet" href="./css/theme-toggle.css" />
</head>
<body>
  <div class="app">
    <aside class="history-box expanded" id="historyBox">
      <h3>Story History</h3>
      <ul id="history"></ul>
      <button id="toggleHistory" class="history-toggle" type="button" aria-label="Expand or collapse history">« Collapse</button>
    </aside>

    <div class="card">
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">Dark mode</button>
      <h1>AI Stories Generator</h1>

      <h3>Story</h3>
      <div id="output"><p class="hint">Your story will appear here</p></div>
      <div class="story-actions">
        <button id="copyBtn" style="display:none">Copy story</button>
      </div>
      <div id="stats" class="stats"></div>

      <div class="controls-box">
        <label>Choose random words!</label>
        <input id="seed" placeholder="Ex: A violinist in Buenos Aires" />
        <input id="tone" placeholder="Choose genre or tone (ex: romantic cyberpunk)" />
        <select id="length">
          <option value="short">Short</option>
          <option value="medium">Medium</option>
          <option value="long">Large</option>
        </select>
        <div class="buttons">
          <button id="btn">Create</button>
          <button id="regenBtn">Regenerate</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <a href="https://alejosworkstuff.github.io/portfolio/">Portfolio</a>
      <span class="separator">•</span>
      <a href="https://github.com/alejosworkstuff">GitHub</a>
    </div>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
