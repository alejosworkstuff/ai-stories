<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Stories Generator</title>
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/history.css" />
  <link rel="stylesheet" href="./css/footer.css" />
  <link rel="stylesheet" href="./css/modal.css" />
  <link rel="stylesheet" href="./css/theme-toggle.css" />
</head>
<body>
  <div class="app">
    <aside class="history-box expanded" id="historyBox">
      <div class="history-header">
        <h3>Story History</h3>
        <button id="clearHistory" class="history-clear" type="button" disabled>Clear all</button>
      </div>
      <ul id="history"></ul>
      <button
        id="toggleHistory"
        class="history-toggle"
        type="button"
        aria-label="Collapse history"
        aria-expanded="true"
      >
        <svg class="history-toggle__icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <path fill="currentColor" d="M10 3L5 8l5 5" />
        </svg>
        <span class="history-toggle__label">Collapse</span>
      </button>
    </aside>

    <div class="card">
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">Dark mode</button>
      <h1>AI Stories Generator</h1>

      <h3>Story</h3>
      <div id="output"><p class="hint">Your story will appear here</p></div>
      <div class="story-actions">
        <button id="copyBtn">Copy story</button>
      </div>
      <div id="stats" class="stats"></div>

      <div class="controls-box">
        <label>Choose random words!</label>
        <input id="seed" placeholder="Ex: A violinist in Buenos Aires" />
        <input id="tone" placeholder="Choose genre or tone (ex: romantic cyberpunk)" />
        <input id="length" type="hidden" value="short" />
        <div class="custom-select" id="lengthDropdown">
          <button
            id="lengthToggle"
            class="custom-select__button"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="lengthOptions"
          >
            <span id="lengthValue">Short</span>
            <span class="custom-select__arrow" aria-hidden="true">v</span>
          </button>
          <ul class="custom-select__list" id="lengthOptions" role="listbox" aria-label="Story length">
            <li role="option" aria-selected="true">
              <button type="button" data-value="short">Short</button>
            </li>
            <li role="option" aria-selected="false">
              <button type="button" data-value="medium">Medium</button>
            </li>
            <li role="option" aria-selected="false">
              <button type="button" data-value="long">Large</button>
            </li>
          </ul>
        </div>
        <input
          id="continuePrompt"
          placeholder="Optional: guide the next part (ex: a sudden betrayal)"
        />
        <div class="buttons">
          <button id="btn">Create</button>
          <button id="regenBtn">Regenerate</button>
          <button id="continueBtn" disabled>Continue</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <a
        class="footer-link portfolio-link"
        href="https://alejosworkstuff.github.io/portfolio/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Portfolio
      </a>
      <a
        class="social-bubble social-github"
        href="https://github.com/alejosworkstuff"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub Profile"
        title="GitHub"
      >
        <img src="./assets/icons/github.svg" alt="" class="social-icon" />
      </a>
      <a
        class="social-bubble social-linkedin"
        href="https://www.linkedin.com/in/alejo-castillo-0b02b73b0/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LinkedIn Profile"
        title="LinkedIn"
      >
        <img src="./assets/icons/linkedin.svg" alt="" class="social-icon" />
      </a>
    </div>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
