<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Stories Generator</title>
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body class="flex h-dvh max-h-dvh flex-col overflow-hidden bg-stone-200 text-stone-900 transition-colors dark:bg-neutral-900 dark:text-stone-100">
  <div class="app flex min-h-0 w-full flex-1 overflow-hidden p-3 pb-20 max-md:p-2 max-md:pb-20">
    <div class="workspace grid h-full min-h-0 w-full min-w-0 flex-1 grid-cols-[auto_1fr] overflow-hidden rounded-lg bg-stone-50 transition-colors dark:bg-neutral-800">
    <aside class="history-box expanded" id="historyBox">
      <div class="history-toolbar mb-1 flex shrink-0 items-center gap-1.5">
        <button
          id="toggleHistory"
          class="history-toggle flex h-7 w-7 shrink-0 cursor-pointer items-center justify-center rounded border-0 bg-stone-300 text-stone-600 transition hover:bg-stone-400 hover:text-stone-800 dark:bg-neutral-700 dark:text-stone-300 dark:hover:bg-neutral-600 dark:hover:text-stone-100"
          type="button"
          aria-label="Collapse history"
          aria-expanded="true"
          title="Collapse history"
        >
          <svg class="history-toggle__icon h-3.5 w-3.5 transition-transform duration-300" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
            <path fill="currentColor" d="M10 3L5 8l5 5" />
          </svg>
        </button>
        <div class="history-panel history-header flex min-w-0 flex-1 items-center justify-between gap-2 border-b border-stone-400 pb-1 dark:border-neutral-600">
          <h3 class="m-0 truncate text-sm font-semibold">Story History</h3>
          <div class="history-menu relative shrink-0" id="historyMenu">
            <button
              id="historyMenuToggle"
              class="history-menu__toggle flex h-7 w-7 cursor-pointer items-center justify-center rounded border-0 bg-transparent text-base font-bold leading-none text-stone-600 transition hover:bg-stone-200 dark:text-stone-300 dark:hover:bg-neutral-700"
              type="button"
              aria-label="History options"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="historyMenuList"
              title="History options"
            >
              ⋯
            </button>
            <ul
              id="historyMenuList"
              class="history-menu__list absolute right-0 top-[calc(100%+4px)] z-20 hidden min-w-[11.5rem] list-none rounded-md border border-stone-300 bg-white p-1 shadow-lg dark:border-neutral-600 dark:bg-neutral-900"
              role="menu"
              aria-label="History options"
            >
              <li role="none">
                <button
                  id="historyFilterFavorites"
                  class="history-menu__item w-full cursor-pointer rounded border-0 bg-transparent px-2.5 py-1.5 text-left text-xs font-medium text-stone-800 transition hover:bg-stone-200 dark:text-stone-100 dark:hover:bg-neutral-700"
                  type="button"
                  role="menuitem"
                  data-action="filter-favorites"
                >
                  Show only favorites
                </button>
              </li>
              <li role="none">
                <button
                  id="historyDeleteMenu"
                  class="history-menu__item w-full cursor-pointer rounded border-0 bg-transparent px-2.5 py-1.5 text-left text-xs font-medium text-red-700 transition hover:bg-red-50 dark:text-red-400 dark:hover:bg-neutral-700"
                  type="button"
                  role="menuitem"
                  data-action="delete"
                >
                  Delete…
                </button>
              </li>
            </ul>
          </div>
        </div>
      </div>
      <ul id="history" class="m-0 min-h-0 flex-1 list-none overflow-y-auto p-0"></ul>
    </aside>

    <div class="workspace-main relative flex h-full min-h-0 w-full min-w-0 flex-col overflow-hidden p-4 max-md:p-3">
      <div class="settings-menu absolute right-3 top-3 z-30 max-md:right-2.5 max-md:top-2.5" id="settingsMenu">
        <button
          id="settingsMenuToggle"
          class="settings-btn"
          type="button"
          aria-label="Configuración"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="settingsMenuList"
          title="Configuración"
        >
          <svg
            class="gear-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="6.4" />
            <circle cx="12" cy="12" r="2.4" />
            <path d="M12 2.5v2.7m0 13.6v2.7M2.5 12h2.7m13.6 0h2.7m-16-6.7 1.9 1.9m9.2 9.2 1.9 1.9m0-13-1.9 1.9m-9.2 9.2-1.9 1.9" />
          </svg>
        </button>
        <div id="settingsMenuList" class="settings-menu__list absolute right-0 top-[calc(100%+8px)] hidden min-w-44 rounded-lg border border-stone-200 bg-white p-1.5 shadow-xl dark:border-neutral-700 dark:bg-neutral-900" role="menu" aria-label="Settings">
          <button id="themeToggle" class="settings-menu__item" type="button" role="menuitem" aria-label="Switch to dark mode">Dark mode</button>
          <button id="streamscopeToggle" class="settings-menu__item" type="button" role="menuitem" aria-label="Open stream debugger" aria-expanded="false" aria-controls="streamscopePanel">Stream debugger</button>
        </div>
      </div>

      <header class="app-header mb-3 shrink-0 pr-24 max-md:pr-20">
        <h1 class="m-0 text-xl font-bold tracking-tight sm:text-2xl">AI Stories Generator</h1>
      </header>

      <h2 class="section-kicker mb-1.5 shrink-0 text-[0.65rem] font-semibold uppercase tracking-[0.12em] text-stone-500 dark:text-stone-400">Your story</h2>
      <div class="story-hud mb-2 min-h-0 flex-1">
        <div
          id="output"
          class="h-full min-h-0 overflow-y-auto rounded-lg border border-stone-200 bg-white/80 p-3 dark:border-neutral-700 dark:bg-neutral-900/80"
        >
          <p class="hint">Your story will appear here</p>
        </div>
        <button id="outputResizeHandle" class="story-hud__resize" type="button" aria-label="Resize story panel" title="Resize story panel"></button>
      </div>

      <div class="story-actions mb-1 shrink-0">
        <button
          id="copyBtn"
          class="hidden cursor-pointer rounded-md border-0 bg-blue-600 px-3 py-1.5 text-sm font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60"
          type="button"
        >
          Copy story
        </button>
      </div>

      <div id="stats" class="stats mb-1 shrink-0 text-xs text-stone-500 dark:text-stone-400"></div>

      <section id="streamscopePanel" class="streamscope-panel mb-2 hidden shrink-0 rounded-lg border border-stone-200 bg-stone-100 p-3 dark:border-neutral-700 dark:bg-neutral-900/60" aria-labelledby="streamscope-title">
        <div class="flex items-center justify-between gap-2">
          <div>
            <p class="m-0 text-[0.65rem] font-semibold uppercase tracking-[0.14em] text-orange-700 dark:text-orange-400">StreamScope</p>
            <h2 id="streamscope-title" class="m-0 text-sm font-semibold">Live stream debugger</h2>
          </div>
          <span id="streamscopeStatus" class="rounded-full bg-stone-300 px-2 py-1 text-[0.65rem] font-semibold uppercase tracking-wide text-stone-700 dark:bg-neutral-700 dark:text-stone-200" data-phase="closed">closed</span>
        </div>
        <ul id="streamscopeEventLog" class="mt-2 max-h-20 min-h-8 overflow-y-auto rounded border border-stone-200 bg-white p-2 font-mono text-xs dark:border-neutral-700 dark:bg-neutral-950" aria-live="polite"></ul>
      </section>

      <div class="controls-box shrink-0 rounded-lg bg-stone-100 p-3 dark:bg-neutral-800/80">
        <div class="controls-heading mb-2 flex items-center justify-between gap-2">
          <div>
            <p class="m-0 text-[0.65rem] font-semibold uppercase tracking-[0.12em] text-blue-700 dark:text-blue-300">Start writing</p>
            <p class="mt-0.5 mb-0 text-xs text-stone-500 dark:text-stone-400">Choose a prompt and a genre.</p>
          </div>
          <span class="controls-spark" aria-hidden="true">✦</span>
        </div>
        <label class="sr-only" for="seed">Story idea</label>
        <input
          id="seed"
          class="mt-1.5 w-full rounded-md border border-stone-300 bg-white px-2.5 py-1.5 text-sm text-stone-900 transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30 dark:border-neutral-600 dark:bg-neutral-900 dark:text-stone-100"
          placeholder="Story idea · A violinist in Buenos Aires"
        />
        <div class="mt-1.5 grid grid-cols-1 gap-1.5 sm:grid-cols-[1fr_auto]">
          <input
            id="tone"
            class="w-full rounded-md border border-stone-300 bg-white px-2.5 py-1.5 text-sm text-stone-900 transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30 dark:border-neutral-600 dark:bg-neutral-900 dark:text-stone-100"
            placeholder="Genre (required) · romantic cyberpunk"
          />
          <input id="length" type="hidden" value="short" />
          <div class="custom-select relative w-full sm:w-36" id="lengthDropdown">
            <button
              id="lengthToggle"
              class="custom-select__button flex w-full cursor-pointer items-center justify-between gap-2 rounded-md border border-stone-300 bg-white px-2.5 py-1.5 text-left text-sm text-stone-900 transition hover:border-stone-400 dark:border-neutral-600 dark:bg-neutral-900 dark:text-stone-100 dark:hover:border-neutral-500"
              type="button"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="lengthOptions"
            >
              <span id="lengthValue">Short</span>
              <span class="custom-select__arrow text-xs text-stone-500 transition-transform dark:text-stone-400" aria-hidden="true">▼</span>
            </button>
            <ul
              class="custom-select__list absolute left-0 right-0 top-[calc(100%+4px)] z-10 hidden list-none rounded-lg border border-stone-300 bg-white p-1 shadow-xl dark:border-neutral-600 dark:bg-neutral-900"
              id="lengthOptions"
              role="listbox"
              aria-label="Story length"
            >
              <li role="option" aria-selected="true">
                <button class="w-full cursor-pointer rounded-md border-0 bg-transparent px-2 py-1.5 text-left text-sm text-stone-900 dark:text-stone-100" type="button" data-value="short">Short</button>
              </li>
              <li role="option" aria-selected="false">
                <button class="w-full cursor-pointer rounded-md border-0 bg-transparent px-2 py-1.5 text-left text-sm text-stone-900 dark:text-stone-100" type="button" data-value="medium">Medium</button>
              </li>
              <li role="option" aria-selected="false">
                <button class="w-full cursor-pointer rounded-md border-0 bg-transparent px-2 py-1.5 text-left text-sm text-stone-900 dark:text-stone-100" type="button" data-value="long">Large</button>
              </li>
            </ul>
          </div>
        </div>
        <input
          id="continuePrompt"
          class="mt-1.5 w-full rounded-md border border-stone-300 bg-white px-2.5 py-1.5 text-sm text-stone-900 transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30 dark:border-neutral-600 dark:bg-neutral-900 dark:text-stone-100"
          placeholder="Optional direction for the next part · a sudden betrayal"
        />
        <div class="buttons mt-2 flex gap-2 max-md:flex-col">
          <button
            id="btn"
            class="cursor-pointer rounded-md border-0 bg-blue-600 px-3 py-1.5 text-sm font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60 max-md:w-full"
            type="button"
          >
            Create
          </button>
          <button
            id="regenBtn"
            class="cursor-pointer rounded-md border-0 bg-blue-600 px-3 py-1.5 text-sm font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60 max-md:w-full"
            type="button"
          >
            Regenerate
          </button>
          <button
            id="continueBtn"
            class="cursor-pointer rounded-md border-0 bg-blue-600 px-3 py-1.5 text-sm font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60 max-md:w-full"
            type="button"
            disabled
          >
            Continue
          </button>
        </div>
      </div>
    </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner mx-auto flex max-w-screen-xl flex-wrap items-center justify-center gap-2 px-1">
      <a
        class="footer-link portfolio-link"
        href="https://alejosworkstuff.github.io/portfolio/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Portfolio
      </a>
      <a
        class="social-bubble social-github"
        href="https://github.com/alejosworkstuff"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub Profile"
        title="GitHub"
      >
        <img src="./assets/icons/github.svg" alt="" class="social-icon" />
      </a>
      <a
        class="social-bubble social-linkedin"
        href="https://www.linkedin.com/in/alejo-castillo-gonzalez/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LinkedIn Profile"
        title="LinkedIn"
      >
        <img src="./assets/icons/linkedin.svg" alt="" class="social-icon" />
      </a>
    </div>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
